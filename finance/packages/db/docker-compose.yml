services:
  postgres:
    image: postgres:latest
    container_name: finance-postgres
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    # Montamos o diretório raiz do cluster para ser compatível com Postgres 18+
    volumes:
      - finance_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  # volume nomeado; será inicializado vazio na primeira subida
  finance_postgres_data:
