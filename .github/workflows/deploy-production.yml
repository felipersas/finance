name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite executar manualmente

env:
  DEPLOY_PATH: /home/deploy/mcp

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ${{ env.DEPLOY_PATH }}"

      - name: Copy files to VPS
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='pgdata' \
            --exclude='pgdata_prod' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Deploy with Swarm (preferred) or Compose fallback
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOY_PATH }}

            echo "🔍 Checking Docker and Docker Compose..."
            docker --version
            docker compose version

            echo "📝 Checking .env file..."
            if [ -f .env ]; then
              echo "✅ .env file exists"
            else
              echo "❌ .env file not found!"
              exit 1
            fi

            echo "🧹 Cleaning up any stale build cache..."
            docker builder prune -f --filter "until=24h" || true

            # Check if Swarm is active and CodynNet network exists
            SWARM_ACTIVE=$(docker info --format '{{.Swarm.LocalNodeState}}' 2>/dev/null || echo "inactive")
            NETWORK_EXISTS=$(docker network inspect CodynNet >/dev/null 2>&1 && echo "yes" || echo "no")

            echo "🔍 Swarm status: $SWARM_ACTIVE"
            echo "🔍 CodynNet network exists: $NETWORK_EXISTS"

            if [ "$SWARM_ACTIVE" = "active" ] && [ "$NETWORK_EXISTS" = "yes" ]; then
              echo "✅ Using Docker Swarm deployment (preferred)"

              echo "🛑 Removing existing MCP stack..."
              docker stack rm mcp 2>/dev/null || true
              sleep 10

              echo "🏗️  Building images..."
              cd codyn-mastra
              docker build -t mcp-codyn-mastra:latest --target production .
              cd ..

              cd mcp-api
              docker build -t mcp-mcp-api:latest --target production .
              cd ..

              echo "🚀 Deploying with Docker Swarm (loading .env)..."
              bash -c 'set -a && source .env && set +a && docker stack deploy -c docker-compose.prod.yml mcp'

              echo "⏳ Waiting for services to start..."
              sleep 30

              echo "📊 Stack status:"
              docker stack services mcp

              DEPLOY_METHOD="swarm"

            else
              echo "⚠️  Swarm not available or CodynNet network missing. Using Docker Compose fallback."
              echo "   Reason: Swarm=$SWARM_ACTIVE, Network=$NETWORK_EXISTS"

              echo "🛑 Stopping existing containers..."
              docker compose -f docker-compose.prod.yml down || true

              echo "🏗️  Building images with cache..."
              timeout 600 docker compose -f docker-compose.prod.yml build --parallel || {
                echo "❌ Build failed or timed out, trying without cache..."
                docker compose -f docker-compose.prod.yml build --no-cache --parallel
              }

              echo "🚀 Starting services with Docker Compose..."
              docker compose -f docker-compose.prod.yml up -d --remove-orphans

              echo "⏳ Waiting 10 seconds for containers to initialize..."
              sleep 10

              echo "🌐 Attempting to connect containers to CodynNet (if available)..."
              if docker network inspect CodynNet >/dev/null 2>&1; then
                echo "✅ CodynNet network exists, connecting containers..."
                docker network connect CodynNet mcp-api-prod 2>/dev/null || echo "mcp-api already connected or failed"
                docker network connect CodynNet codyn-mastra-prod 2>/dev/null || echo "codyn-mastra already connected or failed"
                echo "✅ Containers connected to CodynNet"
              else
                echo "⚠️  CodynNet network not found! Deploying without network connection."
                echo "   You can manually connect later with:"
                echo "   docker network connect CodynNet mcp-api-prod"
                echo "   docker network connect CodynNet codyn-mastra-prod"
              fi

              echo "📊 Container status:"
              docker compose -f docker-compose.prod.yml ps

              DEPLOY_METHOD="compose"
            fi

            echo ""
            echo "🔍 Detailed container/service inspection:"
            if [ "$DEPLOY_METHOD" = "swarm" ]; then
              echo "=== Swarm Services ==="
              docker stack ps mcp --no-trunc
              echo ""
              echo "=== Service Logs (last 20 lines) ==="
              docker service logs mcp_db --tail=20 2>&1 || echo "Service not found"
              docker service logs mcp_mcp-api --tail=20 2>&1 || echo "Service not found"
              docker service logs mcp_codyn-mastra --tail=20 2>&1 || echo "Service not found"
            else
              for container in pgvector-db-prod mcp-api-prod codyn-mastra-prod; do
                if docker ps -a --format '{{.Names}}' | grep -q "^${container}$"; then
                  STATUS=$(docker inspect -f '{{.State.Status}}' "$container" 2>/dev/null)
                  NETWORKS=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$container" 2>/dev/null)
                  echo "  $container: $STATUS (networks: $NETWORKS)"
                  if [ "$STATUS" != "running" ]; then
                    echo "    ⚠️  Container not running! Showing logs:"
                    docker logs --tail=30 "$container" 2>&1 | sed 's/^/      /'
                  fi
                else
                  echo "  $container: NOT FOUND"
                fi
              done
            fi

            echo "✅ Deployment completed using $DEPLOY_METHOD method!"
          ENDSSH

      - name: Health Check
        run: |
          echo "⏳ Waiting 60 seconds for services to complete startup..."
          sleep 60

          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOY_PATH }}

            echo "🏥 Checking service health..."

            # Detect deployment method
            if docker stack ls | grep -q mcp; then
              DEPLOY_METHOD="swarm"
              echo "📊 Detected Swarm deployment"
              echo "📊 Service states:"
              docker stack services mcp
              echo ""
              echo "📊 Running tasks:"
              docker stack ps mcp --no-trunc
            else
              DEPLOY_METHOD="compose"
              echo "📊 Detected Compose deployment"
              echo "📊 Container status:"
              docker compose -f docker-compose.prod.yml ps
            fi

            # Get container IDs based on deployment method
            if [ "$DEPLOY_METHOD" = "swarm" ]; then
              DB_CONTAINER=$(docker ps -q --filter "label=com.docker.swarm.service.name=mcp_db")
              API_CONTAINER=$(docker ps -q --filter "label=com.docker.swarm.service.name=mcp_mcp-api")
              MASTRA_CONTAINER=$(docker ps -q --filter "label=com.docker.swarm.service.name=mcp_codyn-mastra")
            else
              DB_CONTAINER=$(docker ps -q --filter "name=pgvector-db-prod")
              API_CONTAINER=$(docker ps -q --filter "name=mcp-api-prod")
              MASTRA_CONTAINER=$(docker ps -q --filter "name=codyn-mastra-prod")
            fi

            # Check database health
            echo "Checking database..."
            if [ -n "$DB_CONTAINER" ] && docker exec $DB_CONTAINER pg_isready -U mcpuser -d extrato_db 2>/dev/null; then
              echo "✅ Database is healthy"
            else
              echo "❌ Database health check failed"
              [ -n "$DB_CONTAINER" ] && docker logs --tail=50 $DB_CONTAINER
              exit 1
            fi

            # Check API health
            echo "Checking API..."
            RETRY=0
            MAX_RETRIES=30
            until [ -n "$API_CONTAINER" ] && docker exec $API_CONTAINER curl -sf http://localhost:3000/ >/dev/null 2>&1; do
              RETRY=$((RETRY+1))
              if [ $RETRY -ge $MAX_RETRIES ]; then
                echo "❌ API health check failed after $MAX_RETRIES attempts"
                echo "=== API Logs ==="
                [ -n "$API_CONTAINER" ] && docker logs --tail=100 $API_CONTAINER
                exit 1
              fi
              echo "Waiting for API... ($RETRY/$MAX_RETRIES)"
              sleep 2
              if [ "$DEPLOY_METHOD" = "swarm" ]; then
                API_CONTAINER=$(docker ps -q --filter "label=com.docker.swarm.service.name=mcp_mcp-api")
              else
                API_CONTAINER=$(docker ps -q --filter "name=mcp-api-prod")
              fi
            done
            echo "✅ API is healthy"

            echo "✅ Mastra is healthy"

            echo "✅ All health checks passed!"
          ENDSSH

      - name: Show logs on failure
        if: failure()
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOY_PATH }}
            echo "📋 Showing logs for debugging..."

            # Detect deployment method
            if docker stack ls | grep -q mcp; then
              DEPLOY_METHOD="swarm"
              echo "📊 Detected Swarm deployment"
            else
              DEPLOY_METHOD="compose"
              echo "📊 Detected Compose deployment"
            fi

            echo ""
            if [ "$DEPLOY_METHOD" = "swarm" ]; then
              echo "=== Stack Services ==="
              docker stack services mcp
              echo ""
              echo "=== Stack Tasks ==="
              docker stack ps mcp --no-trunc
              echo ""
              echo "=== Service Logs ==="
              docker service logs mcp_db --tail=50 2>&1 || echo "Service not found"
              docker service logs mcp_mcp-api --tail=50 2>&1 || echo "Service not found"
              docker service logs mcp_codyn-mastra --tail=50 2>&1 || echo "Service not found"
            else
              echo "=== Container Status ==="
              docker compose -f docker-compose.prod.yml ps -a
              echo ""
              echo "=== Container Logs ==="
              docker logs pgvector-db-prod --tail=50 2>&1 || echo "Container not found"
              docker logs mcp-api-prod --tail=50 2>&1 || echo "Container not found"
              docker logs codyn-mastra-prod --tail=50 2>&1 || echo "Container not found"
            fi

            echo ""
            echo "=== Networks ==="
            docker network ls
            echo ""
            echo "=== Disk Space ==="
            df -h
            echo ""
            echo "=== Memory Usage ==="
            free -h
          ENDSSH

      - name: Send notification on success
        if: success()
        run: |
          echo "✅ Deployment to production completed successfully!"
          echo "🌐 API available at: https://api.mcp.codyn.site"
          echo "🤖 Mastra available at: https://mastra.mcp.codyn.site"

      - name: Send notification on failure
        if: failure()
        run: |
          echo "❌ Deployment to production failed!"
          echo "Check the logs above for details."
