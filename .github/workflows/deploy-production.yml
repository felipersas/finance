name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite executar manualmente

env:
  DEPLOY_PATH: /home/deploy/mcp

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ${{ env.DEPLOY_PATH }}"

      - name: Copy files to VPS
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='pgdata' \
            --exclude='pgdata_prod' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOY_PATH }}

            echo "🔍 Checking Docker and Docker Compose..."
            docker --version
            docker compose version

            echo "📝 Checking .env file..."
            if [ -f .env ]; then
              echo "✅ .env file exists"
              echo "Variables found:"
              grep -E "^[A-Z_]+" .env | cut -d= -f1 | head -10
            else
              echo "❌ .env file not found!"
              exit 1
            fi

            echo "🛑 Stopping existing containers..."
            docker compose -f docker-compose.prod.yml down || true

            echo "📦 Pulling latest images..."
            docker compose -f docker-compose.prod.yml pull || true

            echo "🏗️  Building images..."
            docker compose -f docker-compose.prod.yml build --no-cache

            echo "🚀 Starting services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "⏳ Waiting 10 seconds for containers to start..."
            sleep 10

            echo "📊 Container status:"
            docker compose -f docker-compose.prod.yml ps

            echo "🔍 Checking container states..."
            docker compose -f docker-compose.prod.yml ps --format json | jq -r '.[] | "\(.Name): \(.State)"'

            echo "🧹 Cleaning up unused images..."
            docker image prune -af

            echo "✅ Deployment completed!"
          ENDSSH

      - name: Health Check
        run: |
          echo "⏳ Waiting 40 seconds for services to start..."
          sleep 40

          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOY_PATH }}

            echo "🏥 Checking service health..."

            # Check container states
            echo "📊 Container states:"
            docker compose -f docker-compose.prod.yml ps

            # Check if containers are running
            RUNNING_COUNT=$(docker compose -f docker-compose.prod.yml ps --format json | jq -r '.[] | select(.State == "running") | .Name' | wc -l)
            TOTAL_COUNT=$(docker compose -f docker-compose.prod.yml ps --format json | jq -r '.[].Name' | wc -l)

            echo "Running: $RUNNING_COUNT / $TOTAL_COUNT containers"

            if [ "$RUNNING_COUNT" -eq "$TOTAL_COUNT" ]; then
              echo "✅ All containers are running"
            else
              echo "❌ Not all containers are running"
              echo "Checking logs of failed containers..."
              docker compose -f docker-compose.prod.yml ps --format json | jq -r '.[] | select(.State != "running") | .Name' | while read container; do
                echo "=== Logs for $container ==="
                docker logs --tail=30 "$container" || true
              done
              exit 1
            fi

            # Check database health
            echo "Checking database..."
            docker exec pgvector-db-prod pg_isready -U mcpuser -d extrato_db || {
              echo "❌ Database health check failed"
              docker logs --tail=30 pgvector-db-prod
              exit 1
            }

            # Check API health
            echo "Checking API..."
            timeout 15 bash -c 'until docker exec mcp-api-prod curl -f http://localhost:3000/health 2>/dev/null; do echo "Waiting for API..."; sleep 2; done' || {
              echo "❌ API health check failed"
              docker logs --tail=30 mcp-api-prod
              exit 1
            }

            # Check Mastra health
            echo "Checking Mastra..."
            timeout 15 bash -c 'until docker exec codyn-mastra-prod curl -f http://localhost:4111/health 2>/dev/null; do echo "Waiting for Mastra..."; sleep 2; done' || {
              echo "⚠️  Mastra health check failed (non-critical)"
              docker logs --tail=30 codyn-mastra-prod || true
            }

            echo "✅ All health checks passed!"
          ENDSSH

      - name: Show logs on failure
        if: failure()
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOY_PATH }}
            echo "📋 Showing logs for debugging..."
            echo ""
            echo "=== Container Status ==="
            docker compose -f docker-compose.prod.yml ps
            echo ""
            echo "=== Database Logs ==="
            docker logs --tail=50 pgvector-db-prod || true
            echo ""
            echo "=== API Logs ==="
            docker logs --tail=50 mcp-api-prod || true
            echo ""
            echo "=== Mastra Logs ==="
            docker logs --tail=50 codyn-mastra-prod || true
            echo ""
            echo "=== Environment Check ==="
            ls -la .env || echo ".env file not found"
            echo ""
            echo "=== Docker Compose Config ==="
            docker compose -f docker-compose.prod.yml config || true
          ENDSSH

      - name: Send notification on success
        if: success()
        run: |
          echo "✅ Deployment to production completed successfully!"
          echo "🌐 API available at: https://api.mcp.codyn.site"
          echo "🤖 Mastra available at: https://mastra.mcp.codyn.site"

      - name: Send notification on failure
        if: failure()
        run: |
          echo "❌ Deployment to production failed!"
          echo "Check the logs above for details."
