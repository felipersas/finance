services:
  # PostgreSQL Database with pgvector for both mcp-api and mcp-server-extrato
  db:
    image: pgvector/pgvector:0.8.1-pg14-trixie
    container_name: pgvector-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: extrato_db
      POSTGRES_USER: mcpuser
      POSTGRES_PASSWORD: mcppassword
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - mcp-network
    mem_limit: 1g
    cpus: 0.33
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpuser -d extrato_db"]
      interval: 10s
      timeout: 5s
      retries: 5



  # NestJS API Service
  mcp-api:
    build:
      context: ./mcp-api
      dockerfile: Dockerfile
      target: development
    container_name: mcp-api
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://mcpuser:mcppassword@db:5432/extrato_db
      - JWT_SECRET=slkdfklçsadkf0892i81uj2iojflkdsajfçlkasjfoiu78
      - JWT_EXPIRES_IN=7d

      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - ./mcp-api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mcp-network
    command: >
      sh -c "
        npx prisma generate &&
        npx prisma migrate deploy &&
        npm run start:dev
      "



volumes:
  pgdata:

networks:
  mcp-network:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
