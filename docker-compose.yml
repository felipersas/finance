services:
  # PostgreSQL Database with pgvector for both mcp-api and mcp-server-extrato
  db:
    image: pgvector/pgvector:0.8.1-pg14-trixie
    container_name: pgvector-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - mcp-network
    mem_limit: 1g
    cpus: 0.33
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5



  # Mastra AI Service
  codyn-mastra:
    build:
      context: ./codyn-mastra
      dockerfile: Dockerfile
      target: development
    container_name: codyn-mastra
    restart: unless-stopped
    ports:
      - "${MASTRA_PORT}:4111"
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./codyn-mastra:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mcp-network
    command: npm run dev

  # NestJS API Service
  mcp-api:
    build:
      context: ./mcp-api
      dockerfile: Dockerfile
      target: development
    container_name: mcp-api
    restart: unless-stopped
    ports:
      - "${API_PORT}:3333"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${API_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - CHATBOT_URL=${CHATBOT_URL}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - ./mcp-api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mcp-network
    command: >
      sh -c "
        npm run start:dev
      "
volumes:
  pgdata:

networks:
  mcp-network:
    driver: bridge
    internal: false
