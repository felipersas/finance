services:
  # PostgreSQL Database with pgvector for both mcp-api and mcp-server-extrato
  db:
    image: pgvector/pgvector:0.8.1-pg14-trixie
    container_name: pgvector-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - mcp-network
      - CodynNet
    mem_limit: 1g
    cpus: 0.33
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5



  # Mastra AI Service
  codyn-mastra:
    build:
      context: ./codyn-mastra
      dockerfile: Dockerfile
      target: development
    container_name: codyn-mastra
    restart: unless-stopped
    ports:
      - "${MASTRA_PORT}:4111"
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./codyn-mastra:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mcp-network
      - CodynNet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.codyn-mastra.rule=Host(`${TRAEFIK_MASTRA_DOMAIN:-mastra.codyn.site}`)"
      - "traefik.http.services.codyn-mastra.loadbalancer.server.port=4111"
      - "traefik.http.routers.codyn-mastra.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.codyn-mastra.service=codyn-mastra"
      - "traefik.docker.network=CodynNet"
      - "traefik.http.routers.codyn-mastra.entrypoints=websecure"
      - "traefik.http.routers.codyn-mastra.priority=1"
    command: npm run dev

  # NestJS API Service
  mcp-api:
    build:
      context: ./mcp-api
      dockerfile: Dockerfile
      target: development
    container_name: mcp-api
    restart: unless-stopped
    ports:
      - "${API_PORT}:3333"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${API_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - CHATBOT_URL=${CHATBOT_URL}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - ./mcp-api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mcp-network
      - CodynNet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-api-dev.rule=Host(`${TRAEFIK_API_DOMAIN:-api.codyn.site}`)"
      - "traefik.http.services.mcp-api-dev.loadbalancer.server.port=3333"
      - "traefik.http.routers.mcp-api-dev.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.mcp-api-dev.service=mcp-api-dev"
      - "traefik.docker.network=CodynNet"
      - "traefik.http.routers.mcp-api-dev.entrypoints=websecure"
      - "traefik.http.routers.mcp-api-dev.priority=1"
    command: >
      sh -c "
        npx prisma generate &&
        npx prisma migrate deploy &&
        npm run start:dev
      "



volumes:
  pgdata:

networks:
  mcp-network:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
  CodynNet:
    external: true
    name: CodynNet
