services:
  # PostgreSQL Database with pgvector for both mcp-api and mcp-server-extrato
  db:
    image: pgvector/pgvector:0.8.1-pg14-trixie
    hostname: db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-extrato_db}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - internal-net
      - CodynNet
    deploy:
      mode: replicated
      replicas: 1
      placement:
        max_replicas_per_node: 1
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      endpoint_mode: vip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-extrato_db}"]
      timeout: 10s
      retries: 10
      interval: 10s
      start_period: 40s
    command: postgres -c shared_preload_libraries=vector -c max_connections=200

  # Mastra AI Service - Production (must start before API)
  codyn-mastra:
    image: mcp-codyn-mastra:latest
    hostname: codyn-mastra
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-extrato_db}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    networks:
      - CodynNet
      - internal-net
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      endpoint_mode: vip
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.codyn-mastra-prod.rule=Host(`${TRAEFIK_MASTRA_DOMAIN:-mastra.codyn.site}`)"
        - "traefik.http.services.codyn-mastra-prod.loadbalancer.server.port=4111"
        - "traefik.http.routers.codyn-mastra-prod.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.codyn-mastra-prod.service=codyn-mastra-prod"
        - "traefik.docker.network=CodynNet"
        - "traefik.http.routers.codyn-mastra-prod.entrypoints=websecure"
        - "traefik.http.routers.codyn-mastra-prod.priority=1"
    healthcheck:
      test: ["CMD", "sh", "-c", "netcat -z localhost 4111 || exit 1"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 90s

  # NestJS API Service - Production
  mcp-api:
    image: mcp-mcp-api:latest
    hostname: mcp-api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-extrato_db}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CHATBOT_URL=http://codyn-mastra:4111
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB:-extrato_db}
    networks:
      - CodynNet
      - internal-net
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      endpoint_mode: vip
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.mcp-api-prod.rule=Host(`${TRAEFIK_DOMAIN:-api.codyn.site}`)"
        - "traefik.http.services.mcp-api-prod.loadbalancer.server.port=3000"
        - "traefik.http.routers.mcp-api-prod.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.mcp-api-prod.service=mcp-api-prod"
        - "traefik.docker.network=CodynNet"
        - "traefik.http.routers.mcp-api-prod.entrypoints=websecure"
        - "traefik.http.routers.mcp-api-prod.priority=1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 60s

volumes:
  pgdata_prod:
    driver: local

networks:
  CodynNet:
    external: true
  internal-net:
    driver: overlay
    attachable: true
